<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculadora">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="val" id="val">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="Backspace" aria-label="Apagar">⌫</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="Dividir">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiplicar">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtrair">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Somar">+</button>
    <button class="fn" data-k="neg" aria-label="Inverter sinal">±</button>
    <button data-k="0">0</button>
    <button data-k=".">,</button>
    <button class="eq" data-k="=">=</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
